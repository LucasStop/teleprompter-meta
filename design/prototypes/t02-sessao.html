<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T02 Sessão ao vivo</title>
<link rel="stylesheet" href="tokens.css">
<style>
  main { display: grid; place-items: center; padding: var(--s5) var(--s4); }
  .phone { width: 390px; max-width: 100%; height: 780px; background: var(--background); border: 1px solid var(--border); border-radius: 40px; display: flex; flex-direction: column; overflow: hidden; }
  .scroll { flex: 1; overflow: auto; padding: var(--s7) var(--s4) var(--s4); display: grid; gap: var(--s4); align-content: start; }
  h2 { font-size: 34px; line-height: 41px; margin: 0; font-weight: 700; }
  .badge { display: inline-flex; align-items: center; gap: var(--s2); font-size: 15px; line-height: 20px; padding: var(--s1) var(--s3); border-radius: 999px; border: 1px solid var(--border); background: var(--surface); width: fit-content; }
  .badge i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .badge.ok i { background: var(--success); } .badge.act i { background: var(--primary); } .badge.err i { background: var(--danger); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s4); display: grid; gap: var(--s2); }
  .card h3 { margin: 0; font-size: 17px; line-height: 22px; font-weight: 600; }
  .card .cap { font-size: 12px; line-height: 16px; color: var(--muted); }
  .partial { color: var(--muted); }
  .answer li { margin-left: var(--s4); }
  .banner { border-radius: var(--r-md); padding: var(--s3) var(--s4); border: 1px solid var(--danger); color: var(--foreground); background: var(--surface); font-size: 15px; line-height: 20px; }
  .banner b { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: var(--s5) var(--s4); }
  .act { padding: var(--s3) var(--s4); border-top: 1px solid var(--border); display: grid; gap: var(--s2); }
  .btn { min-height: 56px; border-radius: var(--r-md); border: 0; background: var(--primary); color: var(--primary-foreground); font: 600 17px var(--font); cursor: pointer; }
  .btn.sec { background: var(--surface); color: var(--foreground); border: 1px solid var(--border); }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border); background: var(--surface); }
  .tabs div { min-height: 56px; display: grid; place-items: center; font-size: 12px; line-height: 16px; color: var(--muted); }
  .tabs div[aria-current] { color: var(--primary); font-weight: 600; }
  .meta { font: 12px/16px var(--mono); color: var(--muted); margin-top: var(--s3); text-align: center; }
</style>
</head>
<body>
<div class="proto-bar" role="toolbar" aria-label="Controles do protótipo">
  <h1>T02 Sessão ao vivo</h1>
  <div class="grp" id="estado"><span class="lbl">Estado</span></div>
  <div class="grp" id="tema"><span class="lbl">Tema</span></div>
</div>
<main>
  <div>
    <div class="phone" id="phone" aria-label="Tela Sessão no iPhone"></div>
    <p class="meta" id="meta"></p>
  </div>
</main>
<script>
const estados = { vazio: "Vazio", ouvindo: "Ouvindo", pensando: "Pensando", resposta: "Resposta", erro: "Erro", desconectado: "Óculos desconectados" };
const temas = { auto: "Sistema", light: "Claro", dark: "Escuro" };
let est = "resposta", tema = "dark";
const $ = (id) => document.getElementById(id);
function btns(box, obj, get, set) {
  Object.entries(obj).forEach(([k, v]) => { const b = document.createElement("button"); b.textContent = v; b.dataset.k = k; b.onclick = () => { set(k); render(); }; box.appendChild(b); });
}
function badge(e) {
  const m = { vazio: ["Pronto", ""], ouvindo: ["Ouvindo", "act"], pensando: ["Buscando resposta", "act"], resposta: ["Resposta pronta", "ok"], erro: ["Sem conexão", "err"], desconectado: ["Óculos desconectados", "err"] }[e];
  return `<span class="badge ${m[1]}"><i></i>${m[0]}</span>`;
}
function render() {
  document.documentElement.dataset.theme = tema === "auto" ? "" : tema;
  document.querySelectorAll("#estado button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === est));
  document.querySelectorAll("#tema button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === tema));
  let c = badge(est);
  if (est === "erro") c += `<div class="banner"><b>Sem conexão.</b> Respondendo só com as notas de Q&amp;A. Verifique a rede e tente de novo.</div>`;
  if (est === "desconectado") c += `<div class="banner"><b>Óculos desconectados.</b> A resposta aparece só no iPhone. Reconecte pelo app Meta AI.</div>`;
  if (est === "vazio") c += `<div class="card empty">Toque em Iniciar escuta para captar a pergunta da banca.</div>`;
  else {
    const q = est === "ouvindo" ? `Por que Swift nativo e não <span class="partial">Flutter...</span>` : "Por que Swift nativo e não Flutter?";
    c += `<div class="card"><span class="cap">Pergunta${est === "ouvindo" ? " (parcial)" : ""}</span><h3>${q}</h3></div>`;
    if (est === "pensando") c += `<div class="card"><span class="cap">Resposta</span><h3>Buscando nas notas e no código...</h3></div>`;
    if (est === "resposta" || est === "desconectado" || est === "erro") c += `<div class="card answer"><span class="cap">Resposta · nota de Q&amp;A · 0,6 s</span><ul style="margin:0;padding:0"><li>DAT SDK só tem módulos Swift</li><li>Menor latência de áudio</li><li>Acesso direto ao SpeechAnalyzer</li></ul></div>`;
  }
  const btn = est === "ouvindo" || est === "pensando" ? `<button class="btn sec">Parar escuta</button>` : `<button class="btn">Iniciar escuta</button>`;
  const rep = est === "resposta" ? `<button class="btn sec">Pedir de novo</button>` : "";
  $("phone").innerHTML = `<div class="scroll"><h2>Sessão</h2>${c}</div><div class="act">${btn}${rep}</div><nav class="tabs" aria-label="Abas"><div aria-current="page">Sessão</div><div>Material</div><div>Ensaio</div><div>Ajustes</div></nav>`;
  $("meta").textContent = `estado: ${est} · tema: ${tema} · iPhone retrato`;
}
btns($("estado"), estados, 0, (k) => (est = k));
btns($("tema"), temas, 0, (k) => (tema = k));
render();
</script>
</body>
</html>
