  pastaIndexando: ["Pasta: indexando", `<div class="badge act"><i></i>Indexando pasta</div><div class="card" style="padding:var(--s4);display:grid;gap:var(--s2)"><b>teleprompter-meta</b><div class="bar" role="progressbar" aria-valuenow="58"><i style="width:58%"></i></div><span class="cap">83 de 143 arquivos</span><span class="cap">docs/ARCHITECTURE.md</span></div>`],
