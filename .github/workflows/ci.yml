name: CI

on:
  pull_request:
  push:
    branches: [main, dev, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: SwiftLint · Testes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: brew install xcodegen swiftlint

      - name: Gerar projeto
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint --strict

      - name: Testes
        run: xcodebuild test -scheme "$SCHEME" -destination 'platform=iOS Simulator,name=iPhone 17'
        env:
          SCHEME: Teleprompter
