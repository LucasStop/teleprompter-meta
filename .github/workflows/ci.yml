name: CI

on:
  pull_request:
  push:
    branches: [main, dev, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ferramentas
        run: brew install gitleaks

      - name: Gitleaks
        run: gitleaks detect --source . --redact --no-banner --config .gitleaks.toml

  check:
    name: SwiftLint · Testes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: brew install xcodegen swiftlint

      - name: Gerar projeto
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint --strict

      - name: Simulador
        run: |
          # O runner nem sempre traz o iPhone 17: usa o primeiro iPhone disponível e cria um se não houver.
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')), ''))")
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "import sys,json; r=[x['identifier'] for x in json.load(sys.stdin)['runtimes'] if x['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS')]; print(sorted(r)[-1])")
            UDID=$(xcrun simctl create "CI iPhone" com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$RUNTIME")
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Testes
        run: xcodebuild test -scheme "$SCHEME" -destination "id=$SIM_UDID" -enableCodeCoverage YES -resultBundlePath build/Test.xcresult
        env:
          SCHEME: Teleprompter

      - name: Gate de cobertura
        run: ./tools/coverage-gate.sh build/Test.xcresult
