name: Teleprompter
options:
  bundleIdPrefix: br.com.lucasstop
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  Teleprompter:
    type: application
    platform: iOS
    sources: [Teleprompter]
    info:
      path: Teleprompter/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: br.com.lucasstop.teleprompter
            CFBundleURLSchemes:
              - teleprompter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.lucasstop.teleprompter
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "O microfone ouve a pergunta da banca para buscar a resposta no seu material."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "O reconhecimento de fala transcreve a pergunta ouvida para buscar a resposta."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  TeleprompterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TeleprompterTests
        excludes: ["Fixtures/**"]
      # Áudios e transcrições do WERHarnessTests: no iPhone físico o caminho do código-fonte não existe.
      - path: TeleprompterTests/Fixtures/perguntas
        type: folder
        buildPhase: resources
    dependencies:
      - target: Teleprompter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.lucasstop.teleprompter.tests
  TeleprompterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TeleprompterUITests]
    dependencies:
      - target: Teleprompter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.lucasstop.teleprompter.uitests
        TEST_TARGET_NAME: Teleprompter
schemes:
  Teleprompter:
    build:
      targets:
        Teleprompter: all
        TeleprompterTests: [test]
        TeleprompterUITests: [test]
    test:
      targets:
        - TeleprompterTests
        - TeleprompterUITests
